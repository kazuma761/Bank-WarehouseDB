# GENERATED from the semantic model 'financial' by bankql.semantic.mercer_mappings — do not edit.
tables:
  district:
    description: Demographic data per district (77 districts). Columns A2..A16 are
      coded; see each description.
    columns:
      district_id: district id (primary key)
      A2: 'district name. Also called: district name, district'
      A3: 'region. Also called: region'
      A4: number of inhabitants (stored as text)
      A5: number of municipalities with fewer than 499 inhabitants (stored as text)
      A6: number of municipalities with 500-1999 inhabitants (stored as text)
      A7: number of municipalities with 2000-9999 inhabitants (stored as text)
      A8: number of municipalities with more than 10000 inhabitants
      A9: number of cities
      A10: ratio of urban inhabitants (percent)
      A11: 'average salary. Also called: average salary, avg salary'
      A12: unemployment rate 1995 (percent)
      A13: unemployment rate 1996 (percent)
      A14: number of entrepreneurs per 1000 inhabitants
      A15: number of committed crimes 1995
      A16: number of committed crimes 1996
  client:
    description: Bank clients (customers). One row per client; no names in BIRD.
    columns:
      client_id: 'client id (primary key); "customer id" means this. Also called:
        customer id, customer'
      gender: 'gender. Values: ''M'' = male; ''F'' = female'
      birth_date: date of birth
      district_id: district where the client lives (FK to district)
  account:
    description: 'Bank accounts. Linked to clients only through disp. Time column:
      date.'
    columns:
      account_id: account id (primary key)
      district_id: location of the branch (FK to district)
      frequency: 'frequency of statement issuance. Values: ''POPLATEK MESICNE'' =
        monthly issuance; ''POPLATEK TYDNE'' = weekly issuance; ''POPLATEK PO OBRATU''
        = issuance after transaction'
      date: date the account was opened
  disp:
    description: Dispositions — which client may operate which account, and with what
      rights.
    columns:
      disp_id: disposition id (primary key)
      client_id: client id (FK to client)
      account_id: account id (FK to account)
      type: 'type of disposition; only the OWNER can issue permanent orders and ask
        for a loan. Values: ''OWNER'' = account owner; ''DISPONENT'' = authorised
        user (not the owner)'
  card:
    description: 'Credit cards issued to a disposition. Time column: issued.'
    columns:
      card_id: card id (primary key)
      disp_id: disposition id (FK to disp)
      type: 'card type. Values: ''junior'' = junior card; ''classic'' = standard card;
        ''gold'' = high-level card'
      issued: date the card was issued
  loan:
    description: 'Loans granted to accounts. Time column: date.'
    columns:
      loan_id: loan id (primary key)
      account_id: account id (FK to account)
      date: date the loan was granted
      amount: approved loan amount (US dollars in BIRD's description)
      duration: loan duration in months
      payments: monthly payment amount
      status: 'repayment status. Values: ''A'' = contract finished, no problems; ''B''
        = contract finished, loan not paid; ''C'' = running contract, OK so far; ''D''
        = running contract, client in debt'
  order:
    description: Permanent (standing) payment orders. Table name is a reserved word
      — always quote it.
    columns:
      order_id: order id (primary key)
      account_id: account the order is issued from (FK to account)
      bank_to: bank of the recipient
      account_to: account of the recipient
      amount: debited amount
      k_symbol: 'characterisation of the payment. Values: ''POJISTNE'' = insurance
        payment; ''SIPO'' = household payment; ''LEASING'' = leasing; ''UVER'' = loan
        payment; '' '' = unspecified'
  trans:
    description: 'Transactions on accounts (the large fact table). Time column: date.'
    columns:
      trans_id: transaction id (primary key)
      account_id: account id (FK to account)
      date: date of transaction
      type: '+/- transaction direction. Values: ''PRIJEM'' = credit; ''VYDAJ'' = withdrawal
        (debit); ''VYBER'' = withdrawal in cash'
      operation: 'mode of transaction. Values: ''VYBER KARTOU'' = credit card withdrawal;
        ''VKLAD'' = credit in cash; ''PREVOD Z UCTU'' = collection from another bank;
        ''VYBER'' = withdrawal in cash; ''PREVOD NA UCET'' = remittance to another
        bank'
      amount: amount of money
      balance: balance after the transaction
      k_symbol: 'characterisation of the transaction. Values: ''POJISTNE'' = insurance
        payment; ''SLUZBY'' = payment for statement; ''UROK'' = interest credited;
        ''SANKC. UROK'' = sanction interest if negative balance; ''SIPO'' = household
        payment; ''DUCHOD'' = old-age pension; ''UVER'' = loan payment'
      bank: bank of the partner (two-letter code)
      account: account of the partner
  client_profile:
    description: SYNTHETIC (Faker en_IN) names, city and masked phone per client —
      not part of BIRD.
    columns:
      client_id: client id (FK to client)
      full_name: client full name
      city: city of residence
      phone_masked: masked phone number
glossary:
  customer: client (client.client_id); a customer's accounts are found via disp
  account owner: disp.type = 'OWNER'
  disponent: disp.type = 'DISPONENT' (authorised user, not the owner)
  statement: transactions (trans) of one account over a date range, ordered by date
  standing order: a row in the "order" table (permanent payment order)
  household payment: k_symbol = 'SIPO'
  insurance payment: k_symbol = 'POJISTNE'
  loan payment: k_symbol = 'UVER'
  old-age pension: trans.k_symbol = 'DUCHOD'
  interest credited: trans.k_symbol = 'UROK'
  monthly statement: account.frequency = 'POPLATEK MESICNE'
  weekly statement: account.frequency = 'POPLATEK TYDNE'
  running: loan.status IN ('C','D')
  finished: loan.status IN ('A','B')
  in debt: loan.status = 'D'
  credit: trans.type = 'PRIJEM'
  deposit: trans.type = 'PRIJEM'
  withdrawal: trans.type = 'VYDAJ'
  debit: trans.type = 'VYDAJ'
  total credits: SUM(CASE WHEN trans.type = 'PRIJEM' THEN trans.amount ELSE 0 END)
    -- total credited amount
  total withdrawals: SUM(CASE WHEN trans.type = 'VYDAJ' THEN trans.amount ELSE 0 END)
    -- total debited amount
  loan default rate: AVG(CASE WHEN loan.status IN ('B','D') THEN 1.0 ELSE 0 END) --
    share of loans not paid or in debt
