# Semantic model for the BIRD "financial" schema (Berka / PKDD'99 Czech bank) — single source of truth.
# Feeds: SQL validator (pii, large tables, time columns), resolver, lookup tools, router glossary,
# and Mercer's mappings.yaml (generated by `python -m bankql.semantic.mercer_mappings`).
# Descriptions follow BIRD's database_description/*.csv; re-diff against the real CSVs when BIRD
# arrives (PROGRESS.md "Later" #1). No evaluation question or gold SQL may be copied in here.
name: financial
description: >-
  Czech retail bank, 1993-1998. Clients have no names in the BIRD data: "customer" means client_id,
  linked to accounts through disp (type OWNER or DISPONENT). Synthetic client_profile adds names.

tables:
  district:
    description: Demographic data per district (77 districts). Columns A2..A16 are coded; see each description.
    columns:
      district_id: {description: district id (primary key)}
      A2: {description: district name, aliases: [district name, district]}
      A3: {description: region, aliases: [region]}
      A4: {description: number of inhabitants (stored as text)}
      A5: {description: number of municipalities with fewer than 499 inhabitants (stored as text)}
      A6: {description: number of municipalities with 500-1999 inhabitants (stored as text)}
      A7: {description: number of municipalities with 2000-9999 inhabitants (stored as text)}
      A8: {description: number of municipalities with more than 10000 inhabitants}
      A9: {description: number of cities}
      A10: {description: ratio of urban inhabitants (percent)}
      A11: {description: average salary, aliases: [average salary, avg salary]}
      A12: {description: unemployment rate 1995 (percent)}
      A13: {description: unemployment rate 1996 (percent)}
      A14: {description: number of entrepreneurs per 1000 inhabitants}
      A15: {description: number of committed crimes 1995}
      A16: {description: number of committed crimes 1996}

  client:
    description: Bank clients (customers). One row per client; no names in BIRD.
    columns:
      client_id: {description: client id (primary key); "customer id" means this, aliases: [customer id, customer]}
      gender: {description: gender, valid_values: {M: male, F: female}}
      birth_date: {description: date of birth}
      district_id: {description: district where the client lives (FK to district)}

  account:
    description: Bank accounts. Linked to clients only through disp.
    time_column: date
    columns:
      account_id: {description: account id (primary key)}
      district_id: {description: location of the branch (FK to district)}
      frequency:
        description: frequency of statement issuance
        valid_values:
          POPLATEK MESICNE: monthly issuance
          POPLATEK TYDNE: weekly issuance
          POPLATEK PO OBRATU: issuance after transaction
      date: {description: date the account was opened}

  disp:
    description: Dispositions — which client may operate which account, and with what rights.
    columns:
      disp_id: {description: disposition id (primary key)}
      client_id: {description: client id (FK to client)}
      account_id: {description: account id (FK to account)}
      type:
        description: type of disposition; only the OWNER can issue permanent orders and ask for a loan
        valid_values: {OWNER: account owner, DISPONENT: authorised user (not the owner)}

  card:
    description: Credit cards issued to a disposition.
    time_column: issued
    columns:
      card_id: {description: card id (primary key)}
      disp_id: {description: disposition id (FK to disp)}
      type: {description: card type, valid_values: {junior: junior card, classic: standard card, gold: high-level card}}
      issued: {description: date the card was issued}

  loan:
    description: Loans granted to accounts.
    time_column: date
    columns:
      loan_id: {description: loan id (primary key)}
      account_id: {description: account id (FK to account)}
      date: {description: date the loan was granted}
      amount: {description: approved loan amount (US dollars in BIRD's description)}
      duration: {description: loan duration in months}
      payments: {description: monthly payment amount}
      status:
        description: repayment status
        valid_values:
          A: contract finished, no problems
          B: contract finished, loan not paid
          C: running contract, OK so far
          D: running contract, client in debt
        value_aliases: {running: "status IN ('C','D')", finished: "status IN ('A','B')", in debt: "status = 'D'"}

  order:
    description: Permanent (standing) payment orders. Table name is a reserved word — always quote it.
    columns:
      order_id: {description: order id (primary key)}
      account_id: {description: account the order is issued from (FK to account)}
      bank_to: {description: bank of the recipient}
      account_to: {description: account of the recipient}
      amount: {description: debited amount}
      k_symbol:
        description: characterisation of the payment
        valid_values: {POJISTNE: insurance payment, SIPO: household payment, LEASING: leasing, UVER: loan payment, " ": unspecified}

  trans:
    description: Transactions on accounts (the large fact table).
    time_column: date
    columns:
      trans_id: {description: transaction id (primary key)}
      account_id: {description: account id (FK to account)}
      date: {description: date of transaction}
      type:
        description: "+/- transaction direction"
        valid_values: {PRIJEM: credit, VYDAJ: withdrawal (debit), VYBER: withdrawal in cash}
        value_aliases: {credit: "type = 'PRIJEM'", deposit: "type = 'PRIJEM'", withdrawal: "type = 'VYDAJ'", debit: "type = 'VYDAJ'"}
      operation:
        description: mode of transaction
        valid_values:
          VYBER KARTOU: credit card withdrawal
          VKLAD: credit in cash
          PREVOD Z UCTU: collection from another bank
          VYBER: withdrawal in cash
          PREVOD NA UCET: remittance to another bank
      amount: {description: amount of money}
      balance: {description: balance after the transaction}
      k_symbol:
        description: characterisation of the transaction
        valid_values:
          POJISTNE: insurance payment
          SLUZBY: payment for statement
          UROK: interest credited
          SANKC. UROK: sanction interest if negative balance
          SIPO: household payment
          DUCHOD: old-age pension
          UVER: loan payment
      bank: {description: bank of the partner (two-letter code)}
      account: {description: account of the partner}

  client_profile:
    description: SYNTHETIC (Faker en_IN) names, city and masked phone per client — not part of BIRD.
    optional: true   # absent in the original BIRD SQLite; resolver disables name lookup then
    columns:
      client_id: {description: client id (FK to client)}
      full_name: {description: client full name, pii: true}
      city: {description: city of residence}
      phone_masked: {description: masked phone number, pii: true}

joins:
  - [disp.client_id, client.client_id]
  - [disp.account_id, account.account_id]
  - [card.disp_id, disp.disp_id]
  - [loan.account_id, account.account_id]
  - [order.account_id, account.account_id]
  - [trans.account_id, account.account_id]
  - [client.district_id, district.district_id]
  - [account.district_id, district.district_id]
  - [client_profile.client_id, client.client_id]

glossary:
  customer: client (client.client_id); a customer's accounts are found via disp
  account owner: "disp.type = 'OWNER'"
  disponent: "disp.type = 'DISPONENT' (authorised user, not the owner)"
  statement: transactions (trans) of one account over a date range, ordered by date
  standing order: a row in the "order" table (permanent payment order)
  household payment: "k_symbol = 'SIPO'"
  insurance payment: "k_symbol = 'POJISTNE'"
  loan payment: "k_symbol = 'UVER'"
  old-age pension: "trans.k_symbol = 'DUCHOD'"
  interest credited: "trans.k_symbol = 'UROK'"
  monthly statement: "account.frequency = 'POPLATEK MESICNE'"
  weekly statement: "account.frequency = 'POPLATEK TYDNE'"

metrics:
  total_credits: {sql: "SUM(CASE WHEN trans.type = 'PRIJEM' THEN trans.amount ELSE 0 END)", description: total credited amount}
  total_withdrawals: {sql: "SUM(CASE WHEN trans.type = 'VYDAJ' THEN trans.amount ELSE 0 END)", description: total debited amount}
  loan_default_rate: {sql: "AVG(CASE WHEN loan.status IN ('B','D') THEN 1.0 ELSE 0 END)", description: share of loans not paid or in debt}
